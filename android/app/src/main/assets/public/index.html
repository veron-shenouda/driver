<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>كابتن المشاوير</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#080C14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="كابتن المشاوير">

  <!-- Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='90' fill='%23080C14'/%3E%3Ccircle cx='256' cy='256' r='180' fill='none' stroke='%23F59E0B' stroke-width='24'/%3E%3Ccircle cx='256' cy='256' r='60' fill='%232563EB' stroke='%23F59E0B' stroke-width='10'/%3E%3Cpath d='M76 256h120m120 0h120M256 316v120' stroke='%23F59E0B' stroke-width='24' stroke-linecap='round'/%3E%3Ccircle cx='256' cy='120' r='20' fill='%2310B981'/%3E%3C/svg%3E">

  <!-- Google Font 'Tajawal' -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="app-shell">

    <!-- Top Navigation Header (Notch Safe) -->
    <header class="top-nav">
      <div class="brand-group">
        <span class="brand-badge">🚕</span>
        <div class="brand-text-col">
          <h1 class="brand-title">كابتن المشاوير</h1>
          <div class="brand-status"><span class="status-dot"></span> متصل وجاهز للرحلات</div>
        </div>
      </div>
      <div class="nav-actions">
        <button id="btnTestAlarm" class="btn-icon-subtle" title="تجربة رنين المنبه الفوري">
          <span class="icon">🔔</span>
          <span class="label">تجربة المنبه</span>
        </button>
        <button id="btnOpenManual" class="btn-icon-primary" title="إضافة مشوار يدوياً">
          <span class="icon">➕</span>
          <span class="label">مشوار</span>
        </button>
      </div>
    </header>

    <!-- Scrollable Driver Dashboard -->
    <main class="main-dashboard">

      <!-- Live Clock & Date Widget -->
      <section class="clock-banner" aria-label="الساعة والتاريخ الحالي">
        <div class="clock-display-row">
          <div class="clock-time-group">
            <span id="liveClockTime" class="clock-time">--:--:--</span>
            <span id="liveClockPeriod" class="clock-period">--</span>
          </div>
          <div id="liveClockDate" class="clock-date">جاري التحميل...</div>
        </div>
      </section>

      <!-- Prominent Voice Input Hero Card (اضغط للتحدث) -->
      <section class="voice-hero-card" id="voiceHeroCard">
        <button id="voiceFabTouch" class="voice-hero-btn" aria-label="اضغط للتحدث لتسجيل المشوار بالصوت">
          <div class="mic-glow-ring">
            <div class="mic-icon-wrap">
              <span id="micIcon" class="mic-icon">🎙️</span>
              <div class="sound-wave-bars" id="soundWaves">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
          </div>
          <div class="voice-text-col">
            <div id="voiceStatusTitle" class="voice-main-title">اضغط للتحدث لتسجيل مشوار ⚡</div>
            <div id="voiceStatusSub" class="voice-sub-title">مثال: "مشوار لأحمد بكرة 5 مساءً"</div>
          </div>
        </button>
      </section>

      <!-- Clean Action Pills (Contacts & Battery) -->
      <section class="quick-tools-grid">
        <button id="btnImportContact" class="btn-tool-pill">
          <span class="pill-icon">📞</span>
          <span class="pill-text">سحب رقم من جهات الاتصال</span>
        </button>
        <button id="btnBatteryFix" class="btn-tool-pill battery">
          <span class="pill-icon">🔋</span>
          <span class="pill-text">استثناء توفير البطارية للمنبه</span>
        </button>
      </section>

      <!-- Schedule Section -->
      <section class="schedule-section">
        <div class="schedule-header">
          <div class="schedule-title-wrap">
            <span class="schedule-title">جدول الرحلات والمشاوير</span>
            <span id="tripsCountBadge" class="trips-count-badge">0 مشوار</span>
          </div>
        </div>

        <!-- Dynamic Trips Container -->
        <div id="tripsContainer" class="trips-list">
          <!-- Populated dynamically via JS -->
        </div>
      </section>

    </main>

  </div> <!-- End app-shell -->

  <!-- Full-Screen Emergency Alarm Dismiss Overlay -->
  <div id="urgentAlarmOverlay" class="urgent-alarm-overlay" role="alertdialog" aria-modal="true">
    <div class="urgent-alarm-content">
      <div class="urgent-alarm-icon">⏰</div>
      <h2 class="urgent-alarm-title">حان موعد المشوار الآن يا كابتن!</h2>
      <p class="urgent-alarm-sub">المنبه الصوتي يعمل بأعلى درجة تنبيه واهتزاز</p>
      <button id="btnStopUrgentAlarm" class="btn-stop-alarm-modern">
        <span>🔕</span> <span>إيقاف التنبيه</span>
      </button>
    </div>
  </div>

  <!-- Modern Manual Add Modal -->
  <div id="modalLayer" class="modal-layer">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">تسجيل مشوار جديد</h3>
        <button id="btnCloseModal" class="btn-close-modal" aria-label="إغلاق">✕</button>
      </div>

      <form id="cleanManualForm" class="modal-form">
        <div class="form-group">
          <label for="manualName" class="form-label">اسم العميل</label>
          <input type="text" id="manualName" class="form-input" placeholder="مثال: أستاذ محمود أو د. أحمد" required>
        </div>

        <div class="form-group">
          <label for="manualPhone" class="form-label">رقم الهاتف (اختياري)</label>
          <input type="tel" id="manualPhone" class="form-input" placeholder="01XXXXXXXXX" dir="ltr">
        </div>

        <div class="form-group">
          <label for="manualType" class="form-label">نوع المشوار</label>
          <select id="manualType" class="form-input">
            <option value="airport">✈️ مشوار مطار</option>
            <option value="travel">🛣️ سفر محافظات</option>
            <option value="school">🎒 توصيلة مدرسة</option>
            <option value="general" selected>🚗 مشوار خاص VIP</option>
          </select>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="manualDate" class="form-label">التاريخ</label>
            <input type="date" id="manualDate" class="form-input" required>
          </div>
          <div class="form-group">
            <label for="manualTime" class="form-label">الوقت</label>
            <input type="time" id="manualTime" class="form-input" required>
          </div>
        </div>

        <div class="form-group">
          <label for="manualPrice" class="form-label">الأجرة بالجنيه (اختياري)</label>
          <input type="number" id="manualPrice" class="form-input" placeholder="مثال: 350">
        </div>

        <button type="submit" class="btn-form-submit">
          <span>حفظ المشوار وتفعيل المنبه ⚡</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification Bar -->
  <div id="toastBar" class="toast-bar">
    <span id="toastIcon" class="toast-icon">✅</span>
    <span id="toastText" class="toast-text">تم حفظ المشوار!</span>
  </div>

  <!-- Scripts -->
  <script src="./js/audio.js"></script>
  <script src="./js/nlp-parser.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/voice.js"></script>
  <script src="./js/alarm-bridge.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
