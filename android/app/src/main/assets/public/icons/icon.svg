<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="190" fill="#0E1726" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="url(#blueGrad)" stroke-width="6" stroke-dasharray="14 8"/>

  <!-- Steering Wheel Luxury Centerpiece -->
  <circle cx="256" cy="256" r="60" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="256" cy="256" r="28" fill="#F59E0B"/>

  <!-- Spokes -->
  <path d="M 66 256 L 196 256" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 316 256 L 446 256" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 256 316 L 256 446" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Luxury Crown Star / Airplane / Status Indicator -->
  <circle cx="256" cy="115" r="18" fill="#10B981" filter="url(#glow)"/>
  <polygon points="256,103 260,113 270,115 262,122 264,132 256,126 248,132 250,122 242,115 252,113" fill="#FFFFFF"/>
</svg>
