name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: # Allows 1-click manual trigger from GitHub web UI

jobs:
  build:
    name: Build Captain Driver Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android || npx cap add android

      - name: Grant Execute Permissions for Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptainDriver-App-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
