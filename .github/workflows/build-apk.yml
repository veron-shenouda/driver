name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  build:
    name: Build Captain Driver APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: |
          npm install

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || npx cap add android

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptainDriver-App-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
